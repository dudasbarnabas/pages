<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Favorite Links</title>

  <!-- XP.css -->
  <link rel="stylesheet" href="https://unpkg.com/xp.css" />

  <!-- Your custom extras -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="desktop">

    <section class="window main-window">
      <div class="title-bar">
        <div class="title-bar-text">favorite-links.exe</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="window-body">
        <h1>Favorite Links</h1>

        <p>
          Welcome to my tiny corner of the internet.
        </p>

        <fieldset>
          <legend>Research</legend>

          <div class="link-list">
            <a href="https://scholar.google.com" target="_blank">Google Scholar</a>
            <a href="https://pubmed.ncbi.nlm.nih.gov" target="_blank">PubMed</a>
            <a href="https://www.zotero.org" target="_blank">Zotero</a>
          </div>
        </fieldset>

        <br />

        <fieldset>
          <legend>Tools</legend>

          <div class="link-list">
            <a href="https://obsidian.md" target="_blank">Obsidian</a>
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://chat.openai.com" target="_blank">ChatGPT</a>
          </div>
        </fieldset>
      </div>
    </section>

  </main>

  <div class="taskbar">
    <button class="start-button">start</button>
    <div class="taskbar-item">favorite-links.exe</div>
  </div>
</body>
</html>
